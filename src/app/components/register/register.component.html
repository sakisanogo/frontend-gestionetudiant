<div class="login-container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card login-card">
                <div class="card-header text-center bg-primary text-white">
                    <h4 class="mb-0">📝 Inscription</h4>
                </div>

                <div class="card-body p-4">
                    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" formControlName="username"
                                placeholder="Choisissez un nom d'utilisateur" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" formControlName="password"
                                placeholder="Au moins 6 caractères" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirmer le mot de passe</label>
                            <input type="password" class="form-control" formControlName="confirmPassword"
                                placeholder="Retapez votre mot de passe" required>
                        </div>

                        <div *ngIf="errorMessage" class="alert alert-danger">
                            {{ errorMessage }}
                        </div>

                        <div *ngIf="successMessage" class="alert alert-success">
                            {{ successMessage }}
                            <div class="mt-2">
                                <small>Redirection automatique vers la page de connexion...</small>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2"
                            [disabled]="!registerForm.valid || loading">
                            <span *ngIf="!loading">Créer mon compte</span>
                            <span *ngIf="loading">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Création...
                            </span>
                        </button>
                    </form>

                    <div class="mt-4 p-3 bg-light rounded">
                        <h6 class="text-center mb-2">Informations importantes :</h6>
                        <div class="small">
                            <div><strong>Nom d'utilisateur:</strong> Au moins 3 caractères</div>
                            <div><strong>Mot de passe:</strong> Au moins 6 caractères</div>
                            <div><strong>Rôle:</strong> Automatiquement "USER"</div>
                        </div>
                    </div>

                    <div class="mt-3 text-center">
                        <p class="mb-0">
                            Déjà un compte ?
                            <a routerLink="/login" class="text-decoration-none">Se connecter</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
