<div class="login-container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card login-card">
                <div class="card-header text-center bg-primary text-white">
                    <h4 class="mb-0">🔐 Connexion</h4>
                </div>

                <div class="card-body p-4">
                    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
                        <div class="mb-3">
                            <label class="form-label">Nom d'utilisateur</label>
                            <input type="text" class="form-control" [(ngModel)]="credentials.username" name="username"
                                placeholder="admin ou user" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Mot de passe</label>
                            <input type="password" class="form-control" [(ngModel)]="credentials.password"
                                name="password" placeholder="Votre mot de passe" required>
                        </div>

                        <div *ngIf="errorMessage" class="alert alert-danger">
                            {{ errorMessage }}
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2"
                            [disabled]="!loginForm.valid || loading">
                            <span *ngIf="!loading">Se connecter</span>
                            <span *ngIf="loading">
                                <span class="spinner-border spinner-border-sm me-2"></span>
                                Connexion...
                            </span>
                        </button>
                    </form>

                    <!--div class="mt-4 p-3 bg-light rounded">
                        <h6 class="text-center mb-2">Comptes de test :</h6>
                        <div class="small">
                            <div><strong>Admin:</strong> admin / admin123</div>
                            <div><strong>User:</strong> user / user123</div>
                        </div>
                    </div-->

                    <!-- ✅ AJOUTER LE LIEN VERS L'INSCRIPTION -->
                    <div class="mt-3 text-center">
                        <p class="mb-0">
                            Pas de compte ?
                            <a routerLink="/register" class="text-decoration-none">S'inscrire</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
