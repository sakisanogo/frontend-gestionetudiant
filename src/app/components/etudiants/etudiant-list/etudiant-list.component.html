<div class="etudiant-list-container">
    <div class="header">
        <h2>Liste des Étudiants</h2>
        <button class="btn-refresh" (click)="refresh()" [disabled]="loading">
            🔄 Rafraîchir
        </button>
    </div>

    <div *ngIf="loading" class="loading">Chargement des étudiants...</div>

    <div *ngIf="error" class="error-alert">
        {{ error }}
        <button (click)="refresh()">Réessayer</button>
    </div>

    <div *ngIf="!loading && etudiants.length === 0" class="no-data">
        Aucun étudiant enregistré
    </div>

    <div *ngIf="!loading && etudiants.length > 0" class="etudiants-grid">
        <div *ngFor="let etudiant of etudiants" class="etudiant-card">
            <div class="card-header">
                <span class="matricule">{{ etudiant.matricule }}</span>
                <button class="btn-delete" (click)="deleteEtudiant(etudiant.id!)" title="Supprimer">
                    🗑️
                </button>
            </div>

            <div class="card-body">
                <h3>{{ etudiant.prenom }} {{ etudiant.nom }}</h3>
                <p class="etudiant-id">ID: {{ etudiant.id }}</p>
            </div>

            <div class="card-footer">
                <button class="btn-detail" (click)="viewDetail(etudiant)">
                    👁️ Voir détails
                </button>
            </div>
        </div>
    </div>

    <app-etudiant-details *ngIf="selectedEtudiant" [etudiant]="selectedEtudiant" (close)="selectedEtudiant = null">
    </app-etudiant-details>
</div>
